# ==============================================================================
# ALINA — Docker Compose Production-Like Hardening Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Or:    pnpm docker:prod
# ==============================================================================
services:
  surrealdb:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  alina-server:
    restart: always
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
