[package]
name = "alina-desktop"
version = "1.0.0"
description = "Autonomous Language Intelligence & Navigation Assistant Desktop"
authors = ["ALINA Team <team@alina.ai>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/alina-ai/alina"

[lib]
name = "alina_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
