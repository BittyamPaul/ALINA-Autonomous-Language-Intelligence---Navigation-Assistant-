<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#090807" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#292524" stroke-width="4" />

  <!-- Outer Orbit Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#292524" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" />
  
  <!-- Subtle Amber Orbital Ring -->
  <circle cx="256" cy="256" r="136" fill="none" stroke="url(#innerGlow)" stroke-width="3" opacity="0.4" />

  <!-- Inner Compass Diamond / Astrolabe Motif -->
  <g transform="translate(256, 256)">
    <!-- Diagonal Subtle Cross -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#44403c" stroke-width="1.5" />
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#44403c" stroke-width="1.5" />

    <!-- Outer Faceted Diamond -->
    <path d="M 0 -110 L 78 0 L 0 110 L -78 0 Z" fill="none" stroke="url(#amberGrad)" stroke-width="4" stroke-linejoin="round" />

    <!-- Inner Solid Core Diamond with Glow -->
    <path d="M 0 -72 L 50 0 L 0 72 L -50 0 Z" fill="url(#amberGrad)" filter="url(#subtleGlow)" opacity="0.95" />

    <!-- Center Pivot Core -->
    <circle cx="0" cy="0" r="14" fill="#0c0a09" stroke="#fbbf24" stroke-width="3" />
    <circle cx="0" cy="0" r="5" fill="#f59e0b" />

    <!-- Cardinal Coordinate Markers -->
    <circle cx="0" cy="-148" r="4" fill="#f59e0b" />
    <circle cx="148" cy="0" r="4" fill="#d97706" />
    <circle cx="0" cy="148" r="4" fill="#b45309" />
    <circle cx="-148" cy="0" r="4" fill="#d97706" />
  </g>
</svg>
