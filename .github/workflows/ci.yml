name: ALINA CI Pipeline

on:
  push:
    branches: [main, 'feature/**', 'release/**']
  pull_request:
    branches: [main]

jobs:
  ci-pipeline:
    name: CI Pipeline (7-Stage Verification)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # ------------------------------------------------------------------------
      # Stage 1: Install Dependencies
      # ------------------------------------------------------------------------
      - name: Stage 1 — Install Dependencies
        run: pnpm install --frozen-lockfile

      # ------------------------------------------------------------------------
      # Stage 2: Typecheck
      # ------------------------------------------------------------------------
      - name: Stage 2 — TypeScript Typecheck
        run: pnpm run typecheck

      # ------------------------------------------------------------------------
      # Stage 3: Lint
      # ------------------------------------------------------------------------
      - name: Stage 3 — Code Quality & Linting
        run: pnpm run lint

      # ------------------------------------------------------------------------
      # Stage 4: Unit Tests
      # ------------------------------------------------------------------------
      - name: Stage 4 — Unit Tests
        run: npx vitest run packages/ --reporter=verbose

      # ------------------------------------------------------------------------
      # Stage 5: Integration Tests
      # ------------------------------------------------------------------------
      - name: Stage 5 — Integration & Resilience Tests
        run: npx vitest run tests/ --reporter=verbose

      # ------------------------------------------------------------------------
      # Stage 6: Build
      # ------------------------------------------------------------------------
      - name: Stage 6 — Build Packages & Desktop Application
        run: pnpm run build

      # ------------------------------------------------------------------------
      # Stage 7: Security & Dependency Checks
      # ------------------------------------------------------------------------
      - name: Stage 7 — Security & Vulnerability Audit
        run: pnpm audit --audit-level=critical || echo "Audit completed with advisory warnings"

